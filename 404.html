<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>404 - الصفحة غير موجودة | M7 CyWeb Sy</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Tajawal', sans-serif; background: #0d1117; color: #c9d1d9; line-height: 1.6; min-height: 100vh; overflow-x: hidden; animation: glitchBody 0.3s ease-out; }
    
    @keyframes glitchBody {
      0% { transform: translate(2px, -2px); filter: hue-rotate(20deg); }
      20% { transform: translate(-2px, 2px); filter: hue-rotate(-20deg); }
      40% { transform: translate(1px, -1px); filter: hue-rotate(10deg); }
      60% { transform: translate(-1px, 1px); filter: hue-rotate(-10deg); }
      80% { transform: translate(0, 0); filter: hue-rotate(0deg); }
      100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
    }
    
    body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
    
    .scanlines { position: fixed; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px); pointer-events: none; z-index: 0; opacity: 0.3; }
    
    .container { position: relative; z-index: 1; width: 100%; max-width: 550px; margin: 0 auto; padding: 40px 16px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center; }
    
    /* Glitch Text */
    .glitch-wrapper { position: relative; display: inline-block; }
    .glitch { font-size: 120px; font-weight: 900; color: white; position: relative; line-height: 1; }
    .glitch::before, .glitch::after { content: '404'; position: absolute; top: 0; right: 0; width: 100%; height: 100%; }
    .glitch::before { left: 2px; text-shadow: -2px 0 #f43f5e; clip: rect(0, 900px, 0, 0); animation: glitchBefore 2s infinite linear alternate-reverse; }
    .glitch::after { left: -2px; text-shadow: -2px 0 #58a6ff; clip: rect(0, 900px, 0, 0); animation: glitchAfter 3s infinite linear alternate-reverse; }
    @keyframes glitchBefore { 0% { clip: rect(30px, 9999px, 50px, 0); } 20% { clip: rect(80px, 9999px, 120px, 0); } 40% { clip: rect(10px, 9999px, 70px, 0); } 60% { clip: rect(90px, 9999px, 130px, 0); } 80% { clip: rect(20px, 9999px, 60px, 0); } 100% { clip: rect(50px, 9999px, 100px, 0); } }
    @keyframes glitchAfter { 0% { clip: rect(50px, 9999px, 30px, 0); } 20% { clip: rect(120px, 9999px, 80px, 0); } 40% { clip: rect(70px, 9999px, 10px, 0); } 60% { clip: rect(130px, 9999px, 90px, 0); } 80% { clip: rect(60px, 9999px, 20px, 0); } 100% { clip: rect(100px, 9999px, 50px, 0); } }
    
    .error-message { font-size: 18px; color: #8b949e; margin-top: 8px; }
    
    /* Dynamic URL */
    .url-display { background: #0d1117; border: 1px solid #30363d; border-radius: 10px; padding: 10px 16px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #f43f5e; display: inline-flex; align-items: center; gap: 8px; }
    .url-display i { color: #f43f5e; }
    
    /* Fake Info */
    .fake-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
    .fake-card { background: rgba(22,27,34,0.8); border: 1px solid #30363d; border-radius: 10px; padding: 12px; text-align: center; }
    .fake-card .label { font-size: 9px; color: #8b949e; letter-spacing: 1px; }
    .fake-card .value { font-size: 13px; color: #58a6ff; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
    
    /* Timer */
    .timer-box { background: rgba(22,27,34,0.8); border: 1px solid #30363d; border-radius: 14px; padding: 16px 20px; }
    .timer-text { font-size: 13px; color: #8b949e; }
    .timer-count { font-size: 32px; font-weight: 900; color: #58a6ff; }
    
    /* Buttons */
    .buttons { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .btn { padding: 14px 24px; border-radius: 12px; font-weight: 700; font-size: 15px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.3s; }
    .btn-primary { background: #58a6ff; color: #0d1117; }
    .btn-primary:hover { background: #79b8ff; transform: translateY(-2px); box-shadow: 0 10px 25px rgba(88,166,255,0.3); }
    .btn-secondary { background: transparent; border: 2px solid #30363d; color: #c9d1d9; }
    .btn-secondary:hover { border-color: #58a6ff; color: #58a6ff; }
    .btn-danger { background: #f43f5e; color: white; }
    .btn-danger:hover { background: #e11d48; }
    
    .footer { color: #8b949e; font-size: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  
  <div class="scanlines"></div>
  
  <div class="container">
    
    <!-- Glitch 404 -->
    <div class="glitch-wrapper">
      <div class="glitch">404</div>
    </div>
    
    <p class="error-message">الرابط غير موجود أو تم نقله</p>
    
    <!-- Dynamic URL -->
    <div class="url-display" id="urlDisplay">
      <i class="fas fa-link"></i>
      <span id="badUrl">/unknown-page</span>
    </div>
    
    <!-- Fake Cyber Info -->
    <div class="fake-info">
      <div class="fake-card">
        <div class="label">🔍 IP Tracked</div>
        <div class="value" id="fakeIP">192.168.1.1</div>
      </div>
      <div class="fake-card">
        <div class="label">📍 Location</div>
        <div class="value" id="fakeLocation">Unknown</div>
      </div>
      <div class="fake-card">
        <div class="label">🛡️ System Scan</div>
        <div class="value" style="color:#22c55e;">Secure ✓</div>
      </div>
      <div class="fake-card">
        <div class="label">⚡ Response</div>
        <div class="value" style="color:#f59e0b;">404 Not Found</div>
      </div>
    </div>
    
    <!-- Smart Buttons -->
    <div class="buttons" id="smartButtons">
      <a href="index.html" class="btn btn-primary"><i class="fas fa-home"></i> الصفحة الرئيسية</a>
      <a href="services.html" class="btn btn-secondary"><i class="fas fa-cogs"></i> استكشف خدماتنا</a>
      <a href="contact.html" class="btn btn-secondary"><i class="fas fa-envelope"></i> تواصل معنا</a>
    </div>
    
    <!-- Timer -->
    <div class="timer-box">
      <div class="timer-text">سيتم تحويلك تلقائياً للصفحة الرئيسية خلال</div>
      <div class="timer-count" id="timerCount">5</div>
    </div>
    
    <div class="footer">
      <i class="fas fa-microchip"></i> M7 CyWeb Sy © 2026
    </div>
    
  </div>
  
  <script>
    // Get bad URL
    const badUrl = window.location.pathname || '/unknown-page';
    document.getElementById('badUrl').textContent = badUrl;
    
    // Fake IP
    const fakeIP = `192.168.${Math.floor(Math.random() * 255)}.${Math.floor(Math.random() * 255)}`;
    document.getElementById('fakeIP').textContent = fakeIP;
    
    // Fake Location
    const locations = ['Damascus, Syria 🇸🇾', 'Aleppo, Syria 🇸🇾', 'Homs, Syria 🇸🇾', 'Latakia, Syria 🇸🇾', 'Unknown Proxy 🌐'];
    document.getElementById('fakeLocation').textContent = locations[Math.floor(Math.random() * locations.length)];
    
    // Smart Buttons
    const smartDiv = document.getElementById('smartButtons');
    if (badUrl.toLowerCase().includes('service')) {
      smartDiv.innerHTML = `<a href="services.html" class="btn btn-primary"><i class="fas fa-cogs"></i> استكشف خدماتنا</a>`;
    } else if (badUrl.toLowerCase().includes('contact')) {
      smartDiv.innerHTML = `<a href="contact.html" class="btn btn-primary"><i class="fas fa-envelope"></i> تواصل معنا</a>`;
    } else if (badUrl.toLowerCase().includes('about')) {
      smartDiv.innerHTML = `<a href="about.html" class="btn btn-primary"><i class="fas fa-building"></i> عن الشركة</a>`;
    }
    
    // Countdown
    let count = 5;
    const timerEl = document.getElementById('timerCount');
    const interval = setInterval(() => {
      count--;
      timerEl.textContent = count;
      if (count <= 0) {
        clearInterval(interval);
        window.location.href = 'index.html';
      }
    }, 1000);
    
    // Play glitch sound
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      oscillator.type = 'square';
      oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
      oscillator.frequency.setValueAtTime(80, audioCtx.currentTime + 0.1);
      gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      oscillator.start(audioCtx.currentTime);
      oscillator.stop(audioCtx.currentTime + 0.3);
    } catch(e) {}
  </script>
</body>
</html>
